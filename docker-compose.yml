services:
  mysql:
    image: mysql:8.0
    container_name: thdc-training-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: thdc_dev_password
      MYSQL_DATABASE: thdc_training
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - thdc_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pthdc_dev_password"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  thdc_mysql_data:
